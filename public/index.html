<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Task Manager</h1>

  <!-- Add Task Form -->
  <div class="add-task-box">
    <input type="text" id="titleInput" placeholder="Task title">
    <input type="text" id="descInput" placeholder="Description">
    <button id="addBtn">Submit</button>
  </div>

  <!-- Task List -->
  <div id="taskList">
    <!-- Tasks will appear here automatically -->
  </div>

  <script src="script.js"></script>
</body>
</html>
